#
# Changes to this file will be overwritten by `trmnlp pull`.
#
# Docs: https://help.trmnl.com/en/articles/10542599-importing-and-exporting-private-plugins#h_581fb988f0
#
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
polling_url: ''
polling_headers: ''
name: My Plugin
description: ''
refresh_interval: 1440
custom_fields:
  - keyname: time_format
    field_type: select
    name: Time format
    options:
      - '12-hour (1:30 PM)': '12'
      - '24-hour (13:30)': '24'
    default: '12'
  - keyname: view_type
    field_type: select
    name: Day view type
    options:
      - 'Event list': list
      - 'Hourly': hourly
    conditional_validation:
      - when: hourly
        hidden:
        - single_column
    default: list
  - keyname: num_days
    field_type: number
    name: Number of days
    description: Number of days to display
    min: 1
    optional: true
    default: 3
  - keyname: single_column
    field_type: boolean
    name: Single Column
    description: Use a single full-width column to display events
    optional: true
  - keyname: show_title_bar
    field_type: boolean
    name: Show Title Bar
    description: Show the title bar at the bottom of the screen. You can see more things without it.
    default: false
