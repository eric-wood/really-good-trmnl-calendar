# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields:
  time_format: '12'
  calendar_1_name: Home
  calendar_2_name: Work
  calendar_3_name: Family
  view_type: hourly

# override variables
variables:
  trmnl:
    plugin_settings:
      # Local dev only: poll the example payload served by bin/dev instead of
      # the real iCal feed (src/settings.yml keeps the LaraPaper polling_url).
      # One URL per line; each becomes IDX_0, IDX_1, IDX_2.
      polling_url: |-
        http://127.0.0.1:4568/data.json
        http://127.0.0.1:4568/data_2.json
        http://127.0.0.1:4568/data_3.json
